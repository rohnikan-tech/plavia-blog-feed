name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Selftest of the gate
        run: python -I tools/validate.py --selftest
      - name: Validate the repository
        run: python -I tools/validate.py
